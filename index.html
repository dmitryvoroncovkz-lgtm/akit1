<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АвтоКит — Подбор и заказ автозапчастей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --wa: #25d366;
      --wa-hover: #1ebc57;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 15px 90px;
    }

    .container {
      max-width: 580px;
      margin: 0 auto;
    }

    /* Переключатель языков */
    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lang-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .info-list {
      list-style: none;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .info-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .info-list strong {
      color: var(--text);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .vin-input {
      text-transform: uppercase;
      font-family: monospace;
      letter-spacing: 0.05em;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      display: block;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-wa {
      background: var(--wa);
      color: #052e16;
    }

    .btn-wa:hover {
      background: var(--wa-hover);
    }

    .btn-submit {
      background: var(--accent);
      color: white;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    /* Карта */
    .map-wrapper {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid var(--border);
    }

    .map-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Плавающая кнопка WhatsApp */
    .wa-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--wa);
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
      z-index: 100;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .wa-float:hover {
      transform: scale(1.1);
    }

    .wa-float svg {
      width: 30px;
      height: 30px;
      fill: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Переключатель языка -->
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLanguage('ru')">Русский</button>
      <button class="lang-btn" onclick="setLanguage('kz')">Қазақша</button>
    </div>

    <header>
      <div class="badge" id="badgeText">Магазин автозапчастей</div>
      <h1>АвтоКит</h1>
      <p class="subtitle" id="subtitleText">Быстрый подбор и заказ автозапчастей в Костанае</p>
    </header>

    <!-- Блок контактов и карты -->
    <div class="card">
      <ul class="info-list">
        <li>
          <span>📍</span>
          <span><strong id="addrLabel">Адрес:</strong> <span id="addrVal">г. Костанай, ул. Ворошилова 11А</span></span>
        </li>
        <li>
          <span>🌐</span>
          <span><strong>Сайт:</strong> akit.kz</span>
        </li>
      </ul>

      <a href="https://wa.me/77000000000" id="directWaBtn" class="btn btn-wa" target="_blank" rel="noopener noreferrer">
        <span id="directWaText">Написать менеджеру в WhatsApp</span>
      </a>

      <!-- Встроенная Google карта -->
      <div class="map-wrapper">
        <iframe 
          loading="lazy" 
          allowfullscreen 
          referrerpolicy="no-referrer-when-downgrade"
          src="https://maps.google.com/maps?q=%D0%9A%D0%BE%D1%81%D1%82%D0%B0%D0%BD%D0%B0%D0%B9,+%D1%83%D0%BB.+%D0%92%D0%BE%D1%80%D0%BE%D1%88%D0%B8%D0%BB%D0%BE%D0%B2%D0%B0+11%D0%90&t=&z=16&ie=UTF8&iwloc=&output=embed">
        </iframe>
      </div>
    </div>

    <!-- Форма подбора запчастей -->
    <div class="card">
      <h2 style="font-size: 1.25rem; margin-bottom: 16px;" id="formTitle">Запрос на подбор детали</h2>
      <form id="partRequestForm">
        <div class="form-group">
          <label for="vinInput" id="vinLabel">VIN-код кузова *</label>
          <input 
            type="text" 
            id="vinInput" 
            class="vin-input" 
            maxlength="17" 
            placeholder="17 знаков (например, XTA...)" 
            required
          >
          <span class="hint" id="vinCounter">Введено: 0 / 17</span>
        </div>

        <div class="form-group">
          <label for="partsInput" id="partsLabel">Необходимые запчасти *</label>
          <textarea 
            id="partsInput" 
            rows="3" 
            placeholder="Колодки, фильтра, детали ходовой..." 
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="phoneInput" id="phoneLabel">Номер телефона для связи *</label>
          <input 
            type="tel" 
            id="phoneInput" 
            placeholder="+7 (___) ___-__-__" 
            required
          >
        </div>

        <button type="submit" class="btn btn-submit" id="submitBtnText">
          Отправить заявку в WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- Плавающая иконка WhatsApp -->
  <a href="https://wa.me/77000000000" id="floatWaBtn" class="wa-float" target="_blank" rel="noopener noreferrer" title="WhatsApp">
    <svg viewBox="0 0 24 24">
      <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 18.06c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.13 8.13 0 0 1-1.25-4.29c0-4.51 3.67-8.18 8.18-8.18 2.19 0 4.24.85 5.79 2.4 1.55 1.55 2.4 3.6 2.4 5.78 0 4.52-3.67 8.19-8.17 8.19zm4.49-6.13c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.61.19 1.16.17 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/>
    </svg>
  </a>

  <script>
    // Вставьте ваш номер WhatsApp без плюса (например: 77051234567)
    const STORE_PHONE = "77000000000";

    document.getElementById('directWaBtn').href = `https://wa.me/${STORE_PHONE}`;
    document.getElementById('floatWaBtn').href = `https://wa.me/${STORE_PHONE}`;

    let currentLang = 'ru';

    const translations = {
      ru: {
        badge: "Магазин автозапчастей",
        subtitle: "Быстрый подбор и заказ автозапчастей в Костанае",
        addrLabel: "Адрес:",
        addrVal: "г. Костанай, ул. Ворошилова 11А",
        directWa: "Написать менеджеру в WhatsApp",
        formTitle: "Запрос на подбор детали",
        vinLabel: "VIN-код кузова *",
        vinPlaceholder: "17 знаков (например, XTA...)",
        vinCounter: "Введено: ",
        partsLabel: "Необходимые запчасти *",
        partsPlaceholder: "Колодки, фильтра, детали ходовой...",
        phoneLabel: "Номер телефона для связи *",
        submitBtn: "Отправить заявку в WhatsApp",
        vinAlert: "Пожалуйста, введите корректный VIN-код из 17 символов.",
        waMsgGreeting: "Здравствуйте! Заявка на подбор запчастей:",
        waMsgVin: "🚘 *VIN:* ",
        waMsgParts: "🔧 *Детали:* ",
        waMsgPhone: "📞 *Телефон:* "
      },
      kz: {
        badge: "Автобөлшектер дүкені",
        subtitle: "Қостанайда автобөлшектерді жылдам таңдау және тапсырыс беру",
        addrLabel: "Мекенжай:",
        addrVal: "Қостанай қ., Ворошилов к-сі 11А",
        directWa: "WhatsApp-пен байланысу",
        formTitle: "Бөлшекке сұраныс беру",
        vinLabel: "Көліктің VIN-коды *",
        vinPlaceholder: "17 таңба (мысалы, XTA...)",
        vinCounter: "Енгізілді: ",
        partsLabel: "Қажетті қосалқы бөлшектер *",
        partsPlaceholder: "Тежегіш қалыптары, сүзгілер...",
        phoneLabel: "Байланыс телефон нөмірі *",
        submitBtn: "Өтінімді WhatsApp-қа жіберу",
        vinAlert: "VIN-код 17 таңбадан тұруы керек.",
        waMsgGreeting: "Сәлеметсіз бе! Автобөлшектерге тапсырыс:",
        waMsgVin: "🚘 *VIN:* ",
        waMsgParts: "🔧 *Бөлшектер:* ",
        waMsgPhone: "📞 *Телефон:* "
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('badgeText').textContent = t.badge;
      document.getElementById('subtitleText').textContent = t.subtitle;
      document.getElementById('addrLabel').textContent = t.addrLabel;
      document.getElementById('addrVal').textContent = t.addrVal;
      document.getElementById('directWaText').textContent = t.directWa;
      document.getElementById('formTitle').textContent = t.formTitle;
      document.getElementById('vinLabel').textContent = t.vinLabel;
      document.getElementById('vinInput').placeholder = t.vinPlaceholder;
      document.getElementById('partsLabel').textContent = t.partsLabel;
      document.getElementById('partsInput').placeholder = t.partsPlaceholder;
      document.getElementById('phoneLabel').textContent = t.phoneLabel;
      document.getElementById('submitBtnText').textContent = t.submitBtn;

      updateCounter();
    }

    const vinInput = document.getElementById('vinInput');
    const vinCounter = document.getElementById('vinCounter');

    function updateCounter() {
      const len = vinInput.value.length;
      vinCounter.textContent = `${translations[currentLang].vinCounter}${len} / 17`;
      vinCounter.style.color = (len === 17) ? '#34d399' : 'var(--muted)';
    }

    vinInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      updateCounter();
    });

    document.getElementById('partRequestForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = translations[currentLang];
      const vin = vinInput.value.trim();
      const parts = document.getElementById('partsInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();

      if (vin.length < 17) {
        alert(t.vinAlert);
        return;
      }

      const msg = `${t.waMsgGreeting}\n\n` +
                  `${t.waMsgVin}${vin}\n` +
                  `${t.waMsgParts}${parts}\n` +
                  `${t.waMsgPhone}${phone}`;

      window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    });
  </script>
</body>
</html>
</body>
</html>
